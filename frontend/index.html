<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional portfolio website built with React and Django" />
    <title>Portfolio</title>
  </head>
  <body>
    <script>
      (function() {
        try {
          var saved = null;
          try { saved = localStorage.getItem('darkMode'); } catch (e) { saved = null; }
          var prefersDark = false;
          try { prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { prefersDark = false; }
          var isDark = (saved !== null) ? JSON.parse(saved) : prefersDark;
          if (isDark) document.documentElement.classList.add('dark-mode');
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
