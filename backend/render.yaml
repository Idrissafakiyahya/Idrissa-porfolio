databases:
  - name: portfolio_db
    databaseName: portfolio
    user: portfolio_user
    region: oregon  # Change to your preferred region
    plan: free

services:
  - type: web
    name: portfolio-backend
    runtime: python
    buildCommand: bash ./build.sh
    startCommand: gunicorn portfolio_site.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio_db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-domain.vercel.app,http://localhost:5173"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: CLOUDINARY_URL
        sync: false
